<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해시 체인 & 머클 트리 시뮬레이션 - OpenHash</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/simulation/sim-common.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo"><span class="logo-icon">◈</span> OpenHash</a>
            <ul class="nav-menu">
                <li><a href="/">홈</a></li>
                <li><a href="/technology/">기술</a></li>
                <li><a href="/simulation/" class="active">시뮬레이션</a></li>
                <li><a href="/tests/">테스트</a></li>
            </ul>
        </div>
    </nav>

    <div class="node-status-bar">
        <div class="container status-row">
            <span class="status-icon" id="statusIcon">●</span>
            <span id="nodeStatusText">노드 연결 확인 중...</span>
            <span class="status-divider">|</span>
            <a href="/simulation/" class="back-link-inline">← 시뮬레이션</a>
            <span class="sim-badge-sm">인터랙티브</span>
            <h1 class="page-title-sm">해시 체인 & 머클 트리 시뮬레이션</h1>
        </div>
    </div>

    <main class="sim-content compact">
        <div class="container">
            <div class="sim-wrapper two-col">
                <!-- 좌측: 컨트롤 패널 -->
                <div class="control-panel">
                    <h3>⛓️ 해시 체인</h3>
                    <div class="control-group">
                        <label class="control-label">계층</label>
                        <select id="layerSelect" class="control-select">
                            <option value="KR-JEJU-SEOGWIPO-JUNGMUN">L1 중문동</option>
                            <option value="KR-JEJU-SEOGWIPO">L2 서귀포시</option>
                            <option value="KR-JEJU">L3 제주도</option>
                            <option value="KR">L4 대한민국</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">거래 데이터</label>
                        <input type="text" id="txData" class="control-input" placeholder="거래 내용...">
                    </div>
                    <button id="addBlockBtn" class="run-btn">블록 추가</button>

                    <div class="inline-controls">
                        <select id="tamperTarget" class="control-select small">
                            <option value="">변조 대상</option>
                        </select>
                        <button id="tamperBtn" class="run-btn small danger">변조</button>
                        <button id="verifyChainBtn" class="run-btn small secondary">검증</button>
                    </div>

                    <div class="divider"></div>

                    <h3>🌳 머클 트리</h3>
                    <div class="control-group">
                        <label class="control-label">거래 추가</label>
                        <input type="text" id="merkleTxInput" class="control-input" placeholder="TX 데이터...">
                    </div>
                    <div class="inline-controls">
                        <button id="addMerkleTxBtn" class="run-btn small">TX 추가</button>
                        <button id="clearMerkleBtn" class="run-btn small secondary">초기화</button>
                    </div>
                    <div class="merkle-root-box">
                        <span>Merkle Root:</span>
                        <strong id="merkleRoot">-</strong>
                    </div>
                </div>

                <!-- 우측: 시각화 영역 -->
                <div class="viz-area">
                    <h3>🔗 해시 체인</h3>
                    <div class="chain-viz" id="chainViz"></div>

                    <h3>🌳 머클 트리 구조</h3>
                    <div class="merkle-tree-viz" id="merkleTreeViz">
                        <div class="merkle-empty">거래를 추가하세요</div>
                    </div>

                    <div class="log-area" id="logArea">
                        <div class="log-line info">[시스템] 해시 체인 & 머클 트리 시뮬레이션 준비 완료</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
    .node-status-bar { position: fixed; top: 60px; left: 0; right: 0; z-index: 999; background: linear-gradient(135deg, #1a3a6e 0%, #0d2240 100%); padding: 10px 0; border-bottom: 2px solid #d4a017; }
    .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-icon { font-size: 10px; }
    .status-icon.online { color: #4ade80; }
    .status-icon.offline { color: #f87171; }
    #nodeStatusText { color: #fff; font-size: 13px; }
    .status-divider { color: rgba(255,255,255,0.3); }
    .back-link-inline { color: #d4a017; font-size: 12px; text-decoration: none; }
    .sim-badge-sm { background: #d4a017; color: #1a3a6e; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .page-title-sm { color: #fff; font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
    .sim-content.compact { padding: 20px 0; margin-top: 100px; }

    .divider { height: 1px; background: var(--gray-200); margin: 16px 0; }
    
    .inline-controls { display: flex; gap: 8px; margin-top: 10px; }
    .run-btn.small { padding: 6px 12px; font-size: 12px; flex: 1; }
    .control-select.small { padding: 6px; font-size: 12px; flex: 1; }
    .run-btn.danger { background: #f87171; }
    .run-btn.danger:hover { background: #ef4444; }
    .run-btn.secondary { background: var(--gray-500); }
    .run-btn.secondary:hover { background: var(--gray-600); }

    .merkle-root-box { margin-top: 12px; padding: 10px; background: rgba(74,222,128,0.1); border: 1px solid #4ade80; border-radius: 6px; font-size: 11px; display: flex; justify-content: space-between; }
    .merkle-root-box strong { font-family: var(--font-mono); color: #4ade80; }

    /* 해시 체인 */
    .chain-viz { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px; background: var(--gray-50); border-radius: 8px; min-height: 80px; margin-bottom: 12px; overflow-x: auto; }
    .block-item { min-width: 110px; padding: 8px; background: #fff; border: 2px solid var(--gray-300); border-radius: 6px; font-size: 10px; transition: all 0.3s; }
    .block-item.valid { border-color: #4ade80; background: rgba(74,222,128,0.1); }
    .block-item.invalid { border-color: #f87171; background: rgba(248,113,113,0.1); }
    .block-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .block-index { font-weight: 700; color: #1a3a6e; }
    .block-layer { font-size: 8px; color: var(--gray-500); }
    .block-hash { font-family: var(--font-mono); font-size: 8px; color: #4ade80; margin-bottom: 2px; }
    .block-item.invalid .block-hash { color: #f87171; }
    .block-data { font-size: 9px; color: var(--gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .block-prev { font-size: 7px; color: var(--gray-400); font-family: var(--font-mono); }
    .chain-arrow { font-size: 16px; color: var(--gray-400); }

    /* 머클 트리 */
    .merkle-tree-viz { padding: 16px; background: var(--gray-50); border-radius: 8px; min-height: 150px; margin-bottom: 12px; }
    .merkle-empty { text-align: center; color: var(--gray-400); font-size: 13px; padding: 40px 0; }
    .merkle-level { margin-bottom: 8px; }
    .level-label { font-size: 10px; color: var(--gray-500); margin-bottom: 4px; text-align: center; }
    .merkle-nodes { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .merkle-node { padding: 8px 12px; background: #fff; border: 2px solid #1a3a6e; border-radius: 6px; text-align: center; transition: all 0.3s; opacity: 1; }
    .merkle-node.root { border-color: #d4a017; background: rgba(212,160,23,0.1); }
    .merkle-node.leaf { border-color: #4ade80; background: rgba(74,222,128,0.1); }
    .merkle-node.building { opacity: 0.3; transform: scale(0.9); }
    .merkle-node.built { opacity: 1; transform: scale(1); }
    .node-hash { font-family: var(--font-mono); font-size: 9px; color: #1a3a6e; }
    .merkle-node.root .node-hash { color: #d4a017; font-weight: 700; }
    .merkle-node.leaf .node-hash { color: #4ade80; }
    .merkle-node.duplicate { opacity: 0.4; border-style: dashed; }
    .node-data { font-size: 8px; color: var(--gray-500); margin-top: 2px; }
    .merkle-connectors { text-align: center; color: var(--gray-300); font-size: 12px; letter-spacing: 20px; margin: 4px 0; }

    .log-area { max-height: 120px; }
    .log-time { color: #888; font-size: 11px; }

    /* 결과 모달 */
    .result-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
    .result-modal.show { opacity: 1; }
    .modal-content { background: #fff; border-radius: 12px; padding: 24px; min-width: 280px; text-align: center; transform: scale(0.9); transition: transform 0.3s; }
    .result-modal.show .modal-content { transform: scale(1); }
    .modal-content.success { border: 3px solid #4ade80; }
    .modal-content.fail { border: 3px solid #f87171; }
    .modal-icon { font-size: 36px; }
    .modal-header h3 { margin: 8px 0; font-size: 18px; }
    .modal-content.success h3 { color: #4ade80; }
    .modal-content.fail h3 { color: #f87171; }
    .result-text { font-size: 13px; color: var(--gray-600); margin-bottom: 16px; }
    .modal-close { background: #1a3a6e; color: #fff; border: none; padding: 8px 28px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
    <script src="/js/config.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        OpenHashConfig.createModeToggle(document.querySelector(".status-row"));
    });
    </script>
    <script src="/js/sim-hashchain.js"></script>
</body>
</html>
