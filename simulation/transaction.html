<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래 시뮬레이션 - OpenHash</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/simulation/sim-common.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo"><span class="logo-icon">◈</span> OpenHash</a>
            <ul class="nav-menu">
                <li><a href="/">홈</a></li>
                <li><a href="/practical/">실용</a></li>
                <li><a href="/technology/">기술</a></li>
                <li><a href="/simulation/" class="active">시뮬레이션</a></li>
                <li><a href="/tests/">테스트</a></li>
            </ul>
        </div>
    </nav>

    <div class="node-status-bar">
        <div class="container status-row">
            <span class="status-icon" id="statusIcon">●</span>
            <span id="nodeStatusText">노드 연결 확인 중...</span>
            <span class="status-divider">|</span>
            <a href="/simulation/" class="back-link-inline">← 시뮬레이션</a>
            <span class="sim-badge-sm">인터랙티브</span>
            <h1 class="page-title-sm">거래 시뮬레이션 - 4계층 분산 거래 처리 체험</h1>
        </div>
    </div>

    <main class="sim-content compact">
        <div class="container">
            <div class="sim-wrapper two-col">
                <div class="control-panel">
                    <h3>💳 거래 설정</h3>
                    <div class="control-group">
                        <label class="control-label">송신자 지역</label>
                        <select id="senderRegion" class="control-select">
                            <option value="KR-JEJU-SEOGWIPO-JUNGMUN">제주 서귀포시 중문동</option>
                            <option value="KR-JEJU-SEOGWIPO-DAEJEONG">제주 서귀포시 대정읍</option>
                            <option value="KR-JEJU-JEJU-NOHYEONG">제주 제주시 노형동</option>
                            <option value="KR-SEOUL-GANGNAM-YEOKSAM">서울 강남구 역삼동</option>
                            <option value="KR-BUSAN-HAEUNDAE-U">부산 해운대구 우동</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">수신자 지역</label>
                        <select id="receiverRegion" class="control-select">
                            <option value="KR-JEJU-SEOGWIPO-DAEJEONG">제주 서귀포시 대정읍</option>
                            <option value="KR-JEJU-SEOGWIPO-JUNGMUN">제주 서귀포시 중문동</option>
                            <option value="KR-JEJU-JEJU-NOHYEONG">제주 제주시 노형동</option>
                            <option value="KR-SEOUL-GANGNAM-YEOKSAM">서울 강남구 역삼동</option>
                            <option value="KR-BUSAN-HAEUNDAE-U">부산 해운대구 우동</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label class="control-label">송금액 (T)</label>
                        <input type="number" id="txAmount" class="control-input" value="10000" min="1">
                    </div>
                    <button id="runSimBtn" class="run-btn">시뮬레이션 실행</button>

                    <!-- 공통 계층 표시 -->
                    <div class="common-layer-box" id="commonLayerBox">
                        <h4>🔗 공통 계층</h4>
                        <div class="common-layer-value" id="commonLayerText">-</div>
                    </div>
                </div>

                <div class="viz-area">
                    <h3>🔄 5단계 거래 검증</h3>
                    <div class="pipeline">
                        <div class="pipeline-step" id="step1" data-step="1">
                            <div class="step-num">1</div>
                            <div class="step-name">잔액 확인</div>
                            <div class="step-desc">송신자 잔액 검증</div>
                            <div class="step-result step-status">-</div>
                        </div>
                        <div class="pipeline-step" id="step2" data-step="2">
                            <div class="step-num">2</div>
                            <div class="step-name">신원 확인</div>
                            <div class="step-desc">DID 인증</div>
                            <div class="step-result step-status">-</div>
                        </div>
                        <div class="pipeline-step" id="step3" data-step="3">
                            <div class="step-num">3</div>
                            <div class="step-name">한도 확인</div>
                            <div class="step-desc">1회 한도 검증</div>
                            <div class="step-result step-status">-</div>
                        </div>
                        <div class="pipeline-step" id="step4" data-step="4">
                            <div class="step-num">4</div>
                            <div class="step-name">AI 이상 탐지</div>
                            <div class="step-desc">패턴 분석</div>
                            <div class="step-result step-status">-</div>
                        </div>
                        <div class="pipeline-step" id="step5" data-step="5">
                            <div class="step-num">5</div>
                            <div class="step-name">규정 준수</div>
                            <div class="step-desc">AML 심사</div>
                            <div class="step-result step-status">-</div>
                        </div>
                    </div>

                    <div class="log-area" id="logArea">
                        <div class="log-line info">[시스템] 거래 시뮬레이션 준비 완료</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
    .node-status-bar { position: fixed; top: 60px; left: 0; right: 0; z-index: 999; background: linear-gradient(135deg, #1a3a6e 0%, #0d2240 100%); padding: 10px 0; border-bottom: 2px solid #d4a017; }
    .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-icon { font-size: 10px; }
    .status-icon.online { color: #4ade80; }
    .status-icon.offline { color: #f87171; }
    #nodeStatusText { color: #fff; font-size: 13px; }
    .status-divider { color: rgba(255,255,255,0.3); }
    .back-link-inline { color: #d4a017; font-size: 12px; text-decoration: none; }
    .sim-badge-sm { background: #d4a017; color: #1a3a6e; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .page-title-sm { color: #fff; font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
    .sim-content.compact { padding: 20px 0; margin-top: 100px; }

    /* 공통 계층 표시 */
    .common-layer-box { margin-top: 16px; padding: 12px; background: var(--gray-50); border-radius: 8px; text-align: center; }
    .common-layer-box h4 { font-size: 12px; margin-bottom: 8px; color: var(--gray-600); }
    .common-layer-value { font-size: 18px; font-weight: 700; color: #1a3a6e; }
    .common-layer-box.found { background: rgba(74,222,128,0.1); border: 1px solid #4ade80; }
    .common-layer-box.found .common-layer-value { color: #4ade80; }

    /* 파이프라인 - 수직 리스트 */
    .pipeline { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .pipeline-step {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 12px;
        background: var(--gray-50);
        border: 2px solid var(--gray-200);
        border-radius: 6px;
        transition: all 0.3s;
    }
    .pipeline-step.active { border-color: #1a3a6e; background: rgba(26,58,110,0.1); }
    .pipeline-step.pass { border-color: #4ade80; background: rgba(74,222,128,0.1); }
    .pipeline-step.fail { border-color: #f87171; background: rgba(248,113,113,0.1); }
    .pipeline-step .step-num {
        width: 24px; height: 24px;
        background: var(--gray-300); color: #fff;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 12px; flex-shrink: 0;
    }
    .pipeline-step.active .step-num { background: #1a3a6e; }
    .pipeline-step.pass .step-num { background: #4ade80; }
    .pipeline-step.fail .step-num { background: #f87171; }
    .pipeline-step .step-name { font-size: 13px; font-weight: 600; width: 90px; }
    .pipeline-step .step-desc { font-size: 11px; color: var(--gray-500); flex: 1; }
    .pipeline-step .step-result { font-size: 12px; font-weight: 600; color: var(--gray-400); width: 50px; text-align: right; }
    .pipeline-step.pass .step-result { color: #4ade80; }
    .pipeline-step.fail .step-result { color: #f87171; }

    .log-area { max-height: 250px; }
    .log-time { color: #888; font-size: 11px; }

    /* 결과 모달 */
    .result-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
    .result-modal.show { opacity: 1; }
    .modal-content { background: #fff; border-radius: 12px; padding: 24px; min-width: 280px; text-align: center; transform: scale(0.9); transition: transform 0.3s; }
    .result-modal.show .modal-content { transform: scale(1); }
    .modal-content.success { border: 3px solid #4ade80; }
    .modal-content.fail { border: 3px solid #f87171; }
    .modal-icon { font-size: 36px; }
    .modal-header h3 { margin: 8px 0; font-size: 18px; }
    .modal-content.success h3 { color: #4ade80; }
    .modal-content.fail h3 { color: #f87171; }
    .result-text { font-size: 13px; color: var(--gray-600); margin-bottom: 16px; }
    .modal-close { background: #1a3a6e; color: #fff; border: none; padding: 8px 28px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
    <script src="/js/config.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        OpenHashConfig.createModeToggle(document.querySelector(".status-row"));
    });
    </script>
    <script src="/js/sim-transaction.js"></script>
</body>
</html>
