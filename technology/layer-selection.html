<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>확률적 계층 선택 - OpenHash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --l1-color: #10b981;
            --l2-color: #3b82f6;
            --l3-color: #8b5cf6;
            --l4-color: #f59e0b;
            --l5-color: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .section-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .section-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--primary);
            color: white;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .section-title .highlight { color: var(--primary); }
        .section-desc {
            color: var(--gray-600);
            font-size: 1rem;
        }

        /* Main Layout */
        .layer-selection-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        /* Map Panel - 정부 스타일 */
        .map-panel {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--gray-200);
        }
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .map-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-800);
        }
        .map-scale {
            font-size: 0.8rem;
            color: var(--gray-500);
            background: var(--gray-100);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
        }
        .map-container {
            position: relative;
            width: 100%;
            height: 420px;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            border-radius: 12px;
            overflow: hidden;
        }

        /* SVG Maps */
        .map-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .map-svg.active {
            opacity: 1;
            pointer-events: auto;
        }
        .map-svg path, .map-svg rect, .map-svg polygon {
            fill: var(--gray-200);
            stroke: white;
            stroke-width: 1.5;
            transition: fill 0.3s;
        }
        .map-svg .region-active {
            fill: rgba(99, 102, 241, 0.25);
            stroke: var(--primary);
            stroke-width: 2;
        }
        .map-svg .region-label {
            font-size: 11px;
            fill: var(--gray-600);
            text-anchor: middle;
            pointer-events: none;
        }
        .map-svg .region-label-sm {
            font-size: 9px;
        }

        /* User Markers */
        .user-marker {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: all 0.5s ease;
        }
        .user-marker .marker-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .user-marker .marker-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .user-marker.user-a .marker-dot { background: #ef4444; }
        .user-marker.user-a .marker-pulse { background: rgba(239, 68, 68, 0.3); }
        .user-marker.user-b .marker-dot { background: #3b82f6; }
        .user-marker.user-b .marker-pulse { background: rgba(59, 130, 246, 0.3); }
        .user-marker .marker-label {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-800);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .user-marker .marker-label::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid var(--gray-800);
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* Connection Line */
        .connection-line {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, #ef4444, #8b5cf6, #3b82f6);
            transform-origin: left center;
            z-index: 5;
            opacity: 0;
            border-radius: 2px;
            transition: opacity 0.5s;
        }
        .connection-line.active { opacity: 1; }

        /* Hash Animation */
        .hash-flow {
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            z-index: 15;
            opacity: 0;
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 700;
        }
        .hash-flow.active {
            opacity: 1;
        }

        /* Info Panel */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Cards - 정부 스타일 */
        .info-card {
            background: white;
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid var(--gray-200);
        }
        .info-card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .info-card-title svg {
            width: 18px;
            height: 18px;
            color: var(--gray-500);
        }

        /* Layer Probability */
        .layer-probs {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .layer-prob {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: opacity 0.3s;
        }
        .layer-prob.disabled { opacity: 0.25; }
        .layer-prob.selected {
            background: rgba(99, 102, 241, 0.08);
            border-radius: 8px;
            margin: -4px -8px;
            padding: 4px 8px;
        }
        .layer-prob.selected .layer-name {
            color: var(--primary);
            font-weight: 600;
        }
        .layer-prob.selected .prob-text {
            color: var(--primary);
            font-weight: 700;
        }
        .layer-badge {
            min-width: 38px;
            height: 26px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            background: var(--gray-400);
            transition: all 0.3s;
        }
        .layer-prob.selected .layer-badge {
            background: var(--primary);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }
        .layer-name {
            font-size: 0.8rem;
            color: var(--gray-600);
            width: 60px;
        }
        .prob-bar-wrap {
            flex: 1;
            height: 26px;
            background: var(--gray-100);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .prob-bar {
            height: 100%;
            border-radius: 5px;
            background: var(--gray-300);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }
        .layer-prob.selected .prob-bar {
            background: linear-gradient(90deg, var(--primary), #818cf8);
        }
        .prob-text {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-700);
        }

        /* Transaction Info */
        .tx-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .tx-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.85rem;
        }
        .tx-row:last-child { border-bottom: none; }
        .tx-label { color: var(--gray-500); }
        .tx-value { font-weight: 600; color: var(--gray-800); }
        .tx-value.hash {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        /* Result Card - 정부 스타일 */
        .result-card {
            background: var(--gray-800);
            border-radius: 8px;
            padding: 1.25rem;
            color: white;
        }
        .result-card-title {
            font-size: 0.8rem;
            color: var(--gray-400);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--gray-700);
        }
        .result-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .result-layer {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--gray-500);
            transition: transform 0.3s, color 0.3s;
        }
        .result-layer.selected {
            color: #60a5fa;
        }
        .result-detail { flex: 1; }
        .result-node {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .result-note {
            font-size: 0.75rem;
            color: var(--gray-400);
        }
        .security-badge {
            margin-top: 1rem;
            padding: 0.625rem 0.75rem;
            background: rgba(96, 165, 250, 0.15);
            border-radius: 6px;
            font-size: 0.78rem;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .security-badge svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Scenario Buttons - 정부 스타일 */
        .scenario-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .scenario-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-300);
            background: white;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s;
        }
        .scenario-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }
        .scenario-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Play Button - 정부 스타일 */
        .play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.5rem;
        }
        .play-btn:hover {
            background: var(--primary-dark);
        }
        .play-btn:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
        }
        .play-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Step Indicator */
        .step-indicator {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gray-300);
            transition: all 0.3s;
        }
        .step-dot.active {
            background: var(--primary);
            transform: scale(1.4);
        }
        .step-dot.done { background: var(--l1-color); }

        /* Responsive */
        @media (max-width: 900px) {
            .layer-selection-container { grid-template-columns: 1fr; }
            .map-container { height: 320px; }
        }
    </style>
    <script src="/js/header.js"></script>
    <link rel="stylesheet" href="/css/hero.css">
</head>
<body>
    <div class="container">
        <div class="section-header">
            <span class="section-badge">Security</span>
            <h2 class="section-title">확률적 <span class="highlight">계층 선택</span></h2>
            <p class="section-desc">거래 기록 위치를 예측 불가능하게 만들어 공격을 원천 차단합니다.</p>
        </div>

        <div class="step-indicator">
            <div class="step-dot" data-step="1"></div>
            <div class="step-dot" data-step="2"></div>
            <div class="step-dot" data-step="3"></div>
            <div class="step-dot" data-step="4"></div>
            <div class="step-dot" data-step="5"></div>
        </div>

        <div class="layer-selection-container">
            <div class="map-panel">
                <div class="map-header">
                    <span class="map-title" id="map-title">제주시 한림읍</span>
                    <span class="map-scale" id="map-scale">읍면동 수준</span>
                </div>
                <div class="map-container" id="map-container">

                    <!-- Map 1: 한림읍 (같은 읍면동) -->
                    <svg class="map-svg active" id="map-dong" viewBox="0 0 400 420">
                        <rect x="20" y="20" width="360" height="380" rx="8" fill="#e0f2fe"/>
                        <!-- 한림읍 리(里) 구역들 -->
                        <path id="dong-hanrim" d="M60,60 L160,50 L180,100 L150,150 L80,140 Z" data-name="한림리"/>
                        <path id="dong-hyeopjae" d="M160,50 L280,55 L290,120 L180,100 Z" data-name="협재리"/>
                        <path id="dong-geumak" d="M280,55 L350,70 L340,150 L290,120 Z" data-name="금악리"/>
                        <path id="dong-gwideok" d="M80,140 L150,150 L140,230 L70,210 Z" data-name="귀덕리"/>
                        <path id="dong-dongmyeong" d="M150,150 L180,100 L290,120 L260,200 L140,230 Z" data-name="동명리"/>
                        <path id="dong-suwo" d="M290,120 L340,150 L320,240 L260,200 Z" data-name="수원리"/>
                        <path id="dong-jangsu" d="M70,210 L140,230 L120,320 L50,300 Z" data-name="장수리"/>
                        <path id="dong-okupo" d="M140,230 L260,200 L240,300 L120,320 Z" data-name="옥포리"/>
                        <path id="dong-myeongwol" d="M260,200 L320,240 L300,330 L240,300 Z" data-name="명월리"/>
                        <path id="dong-sangdae" d="M50,300 L120,320 L100,380 L40,370 Z" data-name="상대리"/>
                        <path id="dong-sangmyeong" d="M120,320 L240,300 L220,380 L100,380 Z" data-name="상명리"/>
                        <path id="dong-geumneung" d="M240,300 L300,330 L280,390 L220,380 Z" data-name="금능리"/>
                        <!-- Labels -->
                        <text x="110" y="105" class="region-label region-label-sm">한림리</text>
                        <text x="220" y="90" class="region-label region-label-sm">협재리</text>
                        <text x="310" y="105" class="region-label region-label-sm">금악리</text>
                        <text x="105" y="185" class="region-label region-label-sm">귀덕리</text>
                        <text x="200" y="175" class="region-label region-label-sm">동명리</text>
                        <text x="305" y="185" class="region-label region-label-sm">수원리</text>
                        <text x="85" y="270" class="region-label region-label-sm">장수리</text>
                        <text x="185" y="270" class="region-label region-label-sm">옥포리</text>
                        <text x="280" y="275" class="region-label region-label-sm">명월리</text>
                        <text x="75" y="345" class="region-label region-label-sm">상대리</text>
                        <text x="165" y="350" class="region-label region-label-sm">상명리</text>
                        <text x="260" y="355" class="region-label region-label-sm">금능리</text>
                    </svg>

                    <!-- Map 2: 제주시 (같은 시군구) -->
                    <svg class="map-svg" id="map-sigungu" viewBox="0 0 500 400">
                        <rect x="20" y="20" width="460" height="360" rx="8" fill="#e0f2fe"/>
                        <!-- 제주시 읍면 - 실제 배치 근사 -->
                        <!-- 추자면 (북서쪽 섬) -->
                        <path id="si-chuja" d="M55,45 L85,40 L92,60 L80,75 L50,70 L45,55 Z" data-name="추자면"/>
                        <!-- 한경면 (서쪽) -->
                        <path id="si-hallim2" d="M65,145 L110,125 L125,180 L120,240 L85,260 L55,240 L50,190 Z" data-name="한경면"/>
                        <!-- 한림읍 -->
                        <path id="si-hanrim" d="M110,125 L175,105 L195,145 L185,195 L125,180 Z" data-name="한림읍"/>
                        <!-- 애월읍 -->
                        <path id="si-aewol" d="M175,105 L255,90 L275,130 L260,180 L195,170 L195,145 Z" data-name="애월읍"/>
                        <!-- 제주시 동지역 (도심) -->
                        <path id="si-jeju" d="M255,90 L340,95 L355,140 L335,185 L275,195 L260,180 L275,130 Z" data-name="제주시내"/>
                        <!-- 조천읍 -->
                        <path id="si-jocheon" d="M340,95 L410,110 L420,165 L390,210 L355,200 L355,140 Z" data-name="조천읍"/>
                        <!-- 구좌읍 -->
                        <path id="si-gujwa" d="M390,210 L420,165 L455,180 L465,240 L440,290 L395,280 Z" data-name="구좌읍"/>
                        <!-- 우도면 -->
                        <ellipse id="si-udo" cx="480" cy="210" rx="18" ry="12" data-name="우도면"/>
                        <!-- 중앙 (산악 지역 표시) -->
                        <path d="M185,195 L260,180 L275,195 L335,185 L355,200 L390,210 L395,280 L350,310 L250,320 L150,300 L120,240 L125,180 Z" fill="rgba(200,200,200,0.3)" stroke="none"/>
                        <!-- 한라산 -->
                        <circle cx="280" cy="260" r="20" fill="rgba(34, 197, 94, 0.2)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
                        <!-- 라벨 -->
                        <text x="68" y="60" class="region-label region-label-sm">추자면</text>
                        <text x="80" y="200" class="region-label">한경면</text>
                        <text x="155" y="155" class="region-label">한림읍</text>
                        <text x="225" y="145" class="region-label">애월읍</text>
                        <text x="305" y="145" class="region-label">제주시내</text>
                        <text x="380" y="160" class="region-label">조천읍</text>
                        <text x="420" y="250" class="region-label">구좌읍</text>
                        <text x="480" y="215" class="region-label region-label-sm">우도</text>
                    </svg>

                    <!-- Map 3: 제주도 (같은 광역시도) -->
                    <svg class="map-svg" id="map-sido" viewBox="0 0 500 450">
                        <rect x="20" y="20" width="460" height="410" rx="8" fill="#e0f2fe"/>
                        <!-- 제주도 실제 윤곽 근사 - 타원형 섬 -->
                        <!-- 제주시 (북부) -->
                        <path id="sido-jejusi" d="M95,165 L130,140 L180,120 L250,110 L320,115 L370,130 L410,155 L420,185 L405,210 L250,220 L100,210 L85,190 Z" data-name="제주시" style="fill: #c7d2fe;"/>
                        <!-- 서귀포시 (남부) -->
                        <path id="sido-seogwipo" d="M100,210 L250,220 L405,210 L415,250 L400,300 L360,340 L290,365 L210,370 L140,355 L90,320 L70,270 L80,235 Z" data-name="서귀포시"/>
                        <!-- 우도 -->
                        <ellipse id="sido-udo" cx="455" cy="170" rx="18" ry="12" data-name="우도"/>
                        <!-- 추자도 -->
                        <path id="sido-chuja" d="M70,55 L95,50 L100,65 L90,78 L65,75 L60,62 Z" data-name="추자도"/>
                        <!-- 마라도 -->
                        <ellipse cx="115" cy="390" rx="8" ry="5" style="fill: var(--gray-200); stroke: white;"/>
                        <!-- 한라산 표시 -->
                        <circle cx="250" cy="240" r="25" fill="rgba(34, 197, 94, 0.2)" stroke="rgba(34, 197, 94, 0.5)" stroke-width="2"/>

        function updateScenario(scenarioId, randomize = true) {
            currentScenario = scenarioId;
            const s = scenarios[scenarioId];

            // Switch map
            document.querySelectorAll('.map-svg').forEach(m => m.classList.remove('active'));
            document.getElementById(s.mapId).classList.add('active');

            // Update header
            mapTitle.textContent = s.mapTitle;
            mapScale.textContent = s.mapScale;
            minLayerEl.textContent = s.minLayerText;

            // 랜덤하게 두 위치 선택 (A와 B는 다른 위치)
            let locA, locB;
            if (randomize && s.locations.length >= 2) {
                const shuffled = [...s.locations].sort(() => Math.random() - 0.5);
                locA = shuffled[0];
                locB = shuffled[1];
            } else {
                locA = s.locations[0];
                locB = s.locations[Math.min(1, s.locations.length - 1)];
            }

            // Update user positions
            userA.style.left = locA.x + 'px';
            userA.style.top = locA.y + 'px';
            userA.querySelector('.marker-label').textContent = 'A: ' + locA.name;

            userB.style.left = locB.x + 'px';
            userB.style.top = locB.y + 'px';
            userB.querySelector('.marker-label').textContent = 'B: ' + locB.name;

            // 현재 선택된 위치 저장
            s.currentA = locA;
            s.currentB = locB;

            // Highlight active regions
            document.querySelectorAll('.map-svg path, .map-svg ellipse').forEach(p => p.classList.remove('region-active'));
            [locA.region, locB.region].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('region-active');
            });

            // Update probability bars
            const layerProbEls = layerProbs.querySelectorAll('.layer-prob');
            layerProbEls.forEach((el, i) => {
                const prob = s.probs[i];
                const bar = el.querySelector('.prob-bar');
                const text = el.querySelector('.prob-text');
                
                bar.style.width = (prob * 0.9) + '%'; // Scale for visual
                text.textContent = prob > 0 ? prob + '%' : '-';
                
                el.classList.toggle('disabled', prob === 0);
                el.classList.remove('selected');
            });

            // Reset UI
            txHashEl.textContent = '-';
            resultLayerEl.textContent = '-';
            resultLayerEl.className = 'result-layer';
            resultNodeEl.textContent = '대기 중...';
            resultNoteEl.textContent = '시뮬레이션을 실행하세요';
            connectionLine.classList.remove('active');
            hashFlow.classList.remove('active');
            resetSteps();

            // Update buttons
            scenarioBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.scenario === scenarioId);
            });
        }

        // Generate fake hash
        function generateHash() {
            const chars = '0123456789abcdef';
            let hash = '';
            for (let i = 0; i < 12; i++) {
                hash += chars[Math.floor(Math.random() * chars.length)];
            }
            return hash + '...';
        }

        // Weighted random selection
        function selectLayer(probs) {
            const total = probs.reduce((a, b) => a + b, 0);
            let rand = Math.random() * total;
            for (let i = 0; i < probs.length; i++) {
                if (rand < probs[i]) return i + 1;
                rand -= probs[i];
            }
            return probs.length;
        }

        // Step indicator
        function setStep(step) {
            stepDots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i + 1 < step) dot.classList.add('done');
                if (i + 1 === step) dot.classList.add('active');
            });
        }

        function resetSteps() {
            stepDots.forEach(dot => dot.classList.remove('active', 'done'));
        }

        // Draw connection
        function drawConnection() {
            const rect = mapContainer.getBoundingClientRect();
            const ax = parseFloat(userA.style.left);
            const ay = parseFloat(userA.style.top);
            const bx = parseFloat(userB.style.left);
            const by = parseFloat(userB.style.top);

            const length = Math.sqrt((bx-ax)**2 + (by-ay)**2);
            const angle = Math.atan2(by-ay, bx-ax) * 180 / Math.PI;

            connectionLine.style.left = ax + 'px';
            connectionLine.style.top = ay + 'px';
            connectionLine.style.width = length + 'px';
            connectionLine.style.transform = `rotate(${angle}deg)`;
        }

        // Animate hash text
        async function animateHash(hash) {
            txHashEl.textContent = '';
            for (let i = 0; i < hash.length; i++) {
                txHashEl.textContent += hash[i];
                await sleep(40);
            }
        }

        // Animate layer selection (roulette effect)
        async function animateLayerSelection(selectedLayer, probs) {
            const layerProbEls = layerProbs.querySelectorAll('.layer-prob');
            const available = probs.map((p, i) => p > 0 ? i : -1).filter(i => i >= 0);
            
            // Fast spin
            for (let i = 0; i < 12; i++) {
                const randIdx = available[Math.floor(Math.random() * available.length)];
                layerProbEls.forEach((el, j) => el.classList.toggle('selected', j === randIdx));
                await sleep(80 + i * 15);
            }

            // Final selection
            layerProbEls.forEach((el, i) => el.classList.toggle('selected', i === selectedLayer - 1));
        }

        // Run simulation
        async function runSimulation() {
            if (isPlaying) return;
            isPlaying = true;
            playBtn.disabled = true;

            // 매 시뮬레이션마다 위치 랜덤화
            updateScenario(currentScenario, true);
            
            const s = scenarios[currentScenario];

            // Step 1: Show users with new positions
            setStep(1);
            await sleep(600);

            // Step 2: Connect users
            setStep(2);
            drawConnection();
            connectionLine.classList.add('active');
            await sleep(800);

            // Step 3: Generate hash
            setStep(3);
            const hash = generateHash();
            await animateHash(hash);
            await sleep(600);

            // Step 4: Layer selection
            setStep(4);
            const selectedLayer = selectLayer(s.probs);
            await animateLayerSelection(selectedLayer, s.probs);
            await sleep(400);

            // Step 5: Show result
            setStep(5);
            const layerNames = ['읍면동', '시군구', '광역시도', '국가', '글로벌'];
            const nodeName = s.nodes[selectedLayer - 1];

            resultLayerEl.textContent = 'L' + selectedLayer;
            resultLayerEl.className = 'result-layer selected';
            resultLayerEl.style.transform = 'scale(1.2)';
            await sleep(200);
            resultLayerEl.style.transform = 'scale(1)';

            resultNodeEl.textContent = nodeName + '에 기록';
            resultNoteEl.textContent = `${layerNames[selectedLayer - 1]} 계층 선택됨 (확률: ${s.probs[selectedLayer - 1]}%)`;

            isPlaying = false;
            playBtn.disabled = false;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Event Listeners
        scenarioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isPlaying) updateScenario(btn.dataset.scenario, true);
            });
        });

        playBtn.addEventListener('click', runSimulation);

        // Initialize
        init();
    </script>
</body>
</html>
